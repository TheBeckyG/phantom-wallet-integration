name: Deploy and Configure GitHub Pages

on:
  push:
    branches: [ main ]

# Ensure the workflow has permissions to push and manage Pages
permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Deploy to gh-pages using GH_PAGES_PAT (preferred)
        if: ${{ secrets.GH_PAGES_PAT != '' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_PAGES_PAT }}
          publish_branch: gh-pages
          publish_dir: ./
          allow_empty_commit: true

      - name: Deploy to gh-pages using GITHUB_TOKEN (fallback)
        if: ${{ secrets.GH_PAGES_PAT == '' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          allow_empty_commit: true

      - name: Configure GitHub Pages to use main root
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO=${{ github.repository }}
          echo "Setting GitHub Pages source to main:/"
          curl -sX PUT -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/pages \
            -d '{"source":{"branch":"main","path":"/"}}' || true

      - name: Show Pages status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO=${{ github.repository }}
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/pages | jq || true
